
apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
    containers:
        - name: backend
          image: microservices-frontend:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80