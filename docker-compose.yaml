

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_service
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      - postgres
    networks:
      - app-network
  
  frontend:
    build:
      context: ./frontend
      dockerfile: frontend/Dockerfile
    container_name: frontend_service
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
networks:
  app-network:
    driver: bridge

                  