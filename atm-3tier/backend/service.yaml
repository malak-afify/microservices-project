apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: backend-app
spec:
  type: ClusterIP
  ports:
  - port: 5000         # البورت اللي الخدمات التانية هتنادي عليه من خلاله
    targetPort: 5000   # البورت اللي شغال عليه الكونتير بتاع الـ Backend
  selector:
    app: backend-app