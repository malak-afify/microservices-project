services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atm
      POSTGRES_USER: atm_user
      POSTGRES_PASSWORD: atm_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atm_user -d atm"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: atm
      DB_USER: atm_user
      DB_PASSWORD: atm_pass
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
