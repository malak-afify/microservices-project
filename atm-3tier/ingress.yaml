apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atm-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # لو كنتِ مستخدمة cert-manager لتفعيل الـ HTTPS/TLS تقدري تضيفي التوجيهات هنا
spec:
  rules:
  - host: malak-atm.duckdns.org
    http:
      paths:
      # توجيه الـ API للـ Backend Service
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
      # توجيه باقي الموقع للـ Frontend Service
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80