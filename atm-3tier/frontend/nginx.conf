server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Tier 1 -> Tier 2: forward API calls to the Flask backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
