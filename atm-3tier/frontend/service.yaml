apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend-app
spec:
  type: ClusterIP  # أو NodePort لو حابة تدخليه مباشرة برقم بورت من غير Ingress
  ports:
  - port: 80         # البورت اللي السيرفس هتسمع عليه
    targetPort: 80   # البورت بتاع Nginx جوه الكونتير
  selector:
    app: frontend-app